[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./"}]

# After clone: forge install foundry-rs/forge-std --no-commit
# Then: forge test --match-contract HappyPath

[fmt]
line_length = 100
